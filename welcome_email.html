<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Welcome to Dollar Bin</title>
</head>
<body style="margin:0; padding:0; background-color: #000000; display:flex; justify-content:center; align-items:center; min-height:100vh;">
  <!-- Wrap the content in a container with a black background -->
  <div style="background-color:#000000; width:100%; display:flex; justify-content:center; align-items:center;">
    <div style="text-align: left; padding: 4%; max-width: 600px; width: 90%; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0);">
      <!-- Use table for better consistency across email clients -->
      <table width="100%" cellpadding="0" cellspacing="0" style="border-collapse: collapse; background-color:#000000;">
        <!-- Line 1 -->
        <tr>
          <td style="display: flex; align-items: center; font-size: 18px; text-transform: uppercase; margin-bottom: 10px; white-space: nowrap; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0);">
            <div style="margin-right: 10px;">&gt;&gt;</div>
            <div>ACCESS GRANTED</div>
          </td>
        </tr>
        <!-- Line 2 -->
        <tr>
          <td style="display: flex; align-items: center; font-size: 18px; text-transform: uppercase; margin-bottom: 10px; white-space: nowrap; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0);">
            <div style="margin-right: 10px;">&gt;&gt;</div>
            <div>WELCOME TO THE DOLLAR BIN</div>
          </td>
        </tr>
        <!-- Line 3 -->
        <tr>
          <td style="display: flex; align-items: center; font-size: 18px; text-transform: uppercase; margin-bottom: 10px; white-space: nowrap; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0);">
            <div style="margin-right: 10px;">&gt;&gt;</div>
            <div>HERE IS YOUR NEW ACCESS CODE</div>
          </td>
        </tr>
        <!-- Code block -->
        <tr>
          <td>
            <pre style="display: inline-block; padding: 15px 25px; border-radius: 8px; font-family: monospace, Arial, sans-serif; font-size: 18px; letter-spacing: 2px; color: rgb(0, 255, 0); user-select: all; margin-top: 10px; white-space: pre;">
/WELCOME
            </pre>
          </td>
        </tr>
        <!-- Additional message: site version info -->
        <tr>
          <td style="display: flex; align-items: center; font-size: 18px; text-transform: uppercase; margin-bottom: 10px; white-space: nowrap; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0);">
            <div style="margin-right: 10px;">&gt;&gt;</div>
            <div>FOR CURRENT SITE VERSION</div>
          </td>
        </tr>
        <tr>
          <td style="display: flex; align-items: center; font-size: 18px; text-transform: uppercase; margin-bottom: 10px; white-space: nowrap; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0);">
            <div style="margin-right: 10px;">&gt;&gt;</div>
            <div>TYPE /VERSION</div>
          </td>
        </tr>
      </table>
      <!-- Unsubscribe link -->
      <div style="margin-top: 20px; font-size: 16px; text-align: center; font-family: monospace, Arial, sans-serif; color: rgb(0, 255, 0); text-decoration: underline; text-transform: uppercase;">
        <a href="{$unsubscribe}" style="color: rgb(0, 255, 0); text-decoration: underline;">UNSUBSCRIBE</a>
      </div>
    </div>
  </div>
</body>
</html>
